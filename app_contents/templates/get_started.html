<!DOCTYPE html>
<html>
    <head>
        <title>Welcome!</title>
    </head>
</head>
<body>
    <h1>Welcome to MComprehend, an interactive Algebra 1 encyclopedia!</h1>
    <a href="{{ url_for('home') }}">Home</a>
    <h2>Linear Equations<h2>
    <a href="{{ url_for('linear_equations') }}">Linear Systems and Equations: Section 1</a>
    <a href="{{ url_for('linear_quiz') }}">Section 1 Quiz</a>
    
   <style>
        @font-face {
            font-family: 'HomeVideo';
            src: url("{{ url_for('static', filename='fonts/HomeVideo.ttf') }}");
        }

        body {
            font-family: 'HomeVideo', sans-serif;
            background-image: url("{{ url_for('static', filename='images/homebackground.jpg') }}");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            display: flex;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: rgba(255, 255, 255, 0.1); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px;
            border-radius: 16px;
            max-width: 700px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        h1 {
            color: #ffffff;
            margin-bottom: 30px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        h2 {
            color: #ffffff;
            margin-bottom: 20px;
            font-size: 2rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .btn-link {
            background-color: #00ffff;
            color: #0d1b2a;
            padding: 12px 24px;
            font-size: 1.1rem;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 255, 255, 0.4);
        }

        .btn-link:hover {
            background-color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.6);
        }

    </style>
</body>
</html>
