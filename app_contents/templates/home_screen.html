<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <meta charset="UTF-8">
  <title>MComprehend</title>
    <style>
    @font-face {
    font-family: 'HomeVideo';
    src: url('{{ url_for("static", filename="fonts/HomeVideo.ttf") }}')
       format('truetype');
    font-weight: normal;
    font-style: normal;
}
        body {
            font-family: 'HomeVideo', sans-serif;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: #507bc0;
        }
    </style>
</head>
<body>
    <div class="container">
        <img class="background-img" src="{{ url_for('static', filename='images/titlecard.png') }}" alt="Background Image">

        <div class="text-overlay">
            <h1>Welcome to MComprehend</h1>
            <p>Explore the world of Algebra 1 with our interactive encyclopedia.</p>
            <form method="post" action="{{ url_for('get_started') }}">
                <button type="submit" class="button">Get Started</button>
            </form>
        </div>
    </div>
    <style>
        body {
            button {
                background-color: #507bc0;
                font-family: 'HomeVideo', sans-serif;
                color: white;
                border: none;
                padding: 10px 20px;
                text-align: center;
                text-decoration: none;
                display: inline-block;
                font-size: 16px;
                margin: 4px 2px;
                cursor: pointer;
            }
        }
    </style>
</body>
</html>
